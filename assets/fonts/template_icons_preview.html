<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TemplateIcons 字体图标预览</title>
    <style>
      @font-face {
        font-family: "TemplateIcons";
        src: url("./template_icons.otf") format("opentype");
        font-display: block;
        font-style: normal;
        font-weight: normal;
      }

      :root {
        color-scheme: light;
        --page-bg: #f3f5f6;
        --surface: #ffffff;
        --surface-muted: #e9edef;
        --border: #d5dbde;
        --text: #172026;
        --text-muted: #5c6870;
        --accent: #00796b;
        --accent-strong: #005f54;
        --focus: #d18a00;
        --icon-size: 56px;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 280px;
        min-height: 100vh;
        margin: 0;
        background: var(--page-bg);
        color: var(--text);
      }

      button,
      input {
        font: inherit;
      }

      button,
      input[type="range"] {
        cursor: pointer;
      }

      .topbar {
        background: #202628;
        color: #ffffff;
        border-bottom: 4px solid var(--accent);
      }

      .topbar-inner,
      .toolbar-inner,
      main {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
      }

      .topbar-inner {
        min-height: 116px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 24px 0;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(26px, 5vw, 36px);
        line-height: 1.15;
        letter-spacing: 0;
      }

      .subtitle {
        margin: 0;
        color: #cbd2d5;
        font-size: 14px;
      }

      .summary {
        flex: 0 0 auto;
        display: grid;
        grid-template-columns: repeat(2, minmax(88px, 1fr));
        border: 1px solid #485155;
        border-radius: 6px;
        overflow: hidden;
      }

      .summary-item {
        min-height: 60px;
        padding: 9px 14px;
        background: #2a3134;
      }

      .summary-item + .summary-item {
        border-left: 1px solid #485155;
      }

      .summary-value,
      .summary-label {
        display: block;
      }

      .summary-value {
        font-size: 18px;
        font-weight: 700;
      }

      .summary-label {
        margin-top: 3px;
        color: #b8c1c5;
        font-size: 12px;
      }

      .toolbar {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }

      .toolbar-inner {
        display: grid;
        grid-template-columns: minmax(200px, 1fr) minmax(190px, 0.65fr) auto;
        align-items: end;
        gap: 18px;
        padding: 18px 0;
      }

      .control {
        min-width: 0;
      }

      .control-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 20px;
        margin-bottom: 7px;
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 700;
      }

      .search-wrap {
        position: relative;
      }

      .search-wrap input {
        width: 100%;
        height: 40px;
        padding: 0 42px 0 12px;
        color: var(--text);
        background: var(--surface);
        border: 1px solid #aeb8bd;
        border-radius: 6px;
        outline: none;
      }

      .search-wrap input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgb(0 121 107 / 16%);
      }

      .clear-search {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 32px;
        height: 32px;
        padding: 0;
        color: var(--text-muted);
        background: transparent;
        border: 0;
        border-radius: 4px;
        font-size: 20px;
        line-height: 1;
      }

      .clear-search:hover {
        color: var(--text);
        background: var(--surface-muted);
      }

      .size-row {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .size-row input {
        width: 100%;
        accent-color: var(--accent);
      }

      .size-value {
        min-width: 48px;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .segmented {
        height: 40px;
        display: grid;
        grid-template-columns: repeat(2, minmax(62px, 1fr));
        border: 1px solid #aeb8bd;
        border-radius: 6px;
        overflow: hidden;
      }

      .segmented button {
        padding: 0 13px;
        color: var(--text-muted);
        background: var(--surface);
        border: 0;
      }

      .segmented button + button {
        border-left: 1px solid #aeb8bd;
      }

      .segmented button[aria-pressed="true"] {
        color: #ffffff;
        background: var(--accent);
      }

      main {
        padding: 26px 0 48px;
      }

      .results-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      .results-count {
        margin: 0;
        color: var(--text-muted);
        font-size: 13px;
      }

      .font-state {
        margin: 0;
        color: var(--accent-strong);
        font-size: 13px;
        font-weight: 700;
      }

      .font-state.error {
        color: #a62b1f;
      }

      .icon-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(238px, 1fr));
        gap: 14px;
      }

      .icon-card {
        min-width: 0;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 7px;
      }

      .icon-card:focus-within,
      .icon-card:hover {
        border-color: #9aa6ab;
        box-shadow: 0 4px 14px rgb(24 32 38 / 8%);
      }

      .glyph-stage {
        min-height: 150px;
        display: grid;
        place-items: center;
        padding: 20px;
        color: #111719;
        background-color: #f8fafb;
        background-image:
          linear-gradient(45deg, #e8edef 25%, transparent 25%),
          linear-gradient(-45deg, #e8edef 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #e8edef 75%),
          linear-gradient(-45deg, transparent 75%, #e8edef 75%);
        background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        background-size: 16px 16px;
        border-bottom: 1px solid var(--border);
      }

      .icon-grid.dark-preview .glyph-stage {
        color: #f6f8f8;
        background-color: #242a2d;
        background-image:
          linear-gradient(45deg, #30383b 25%, transparent 25%),
          linear-gradient(-45deg, #30383b 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #30383b 75%),
          linear-gradient(-45deg, transparent 75%, #30383b 75%);
      }

      .glyph {
        display: inline-block;
        font-family: "TemplateIcons";
        font-size: var(--icon-size);
        font-style: normal;
        font-weight: normal;
        font-variant: normal;
        line-height: 1;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
        font-synthesis: none;
      }

      .icon-meta {
        padding: 14px;
      }

      .icon-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .icon-name {
        min-width: 0;
        overflow: hidden;
        font-size: 15px;
        font-weight: 750;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .copy-button {
        flex: 0 0 auto;
        height: 32px;
        padding: 0 10px;
        color: var(--accent-strong);
        background: #e2f1ee;
        border: 1px solid #afd3cd;
        border-radius: 5px;
        font-size: 12px;
        font-weight: 700;
      }

      .copy-button:hover,
      .copy-button:focus-visible {
        color: #ffffff;
        background: var(--accent);
        border-color: var(--accent);
      }

      .codepoint {
        display: block;
        margin-top: 6px;
        color: var(--text-muted);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 12px;
      }

      .description {
        min-height: 38px;
        margin: 10px 0 0;
        color: var(--text-muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .empty-state {
        display: none;
        min-height: 180px;
        place-items: center;
        color: var(--text-muted);
        background: var(--surface);
        border: 1px dashed #aeb8bd;
        border-radius: 7px;
      }

      .empty-state.visible {
        display: grid;
      }

      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        max-width: min(360px, calc(100% - 40px));
        padding: 11px 14px;
        color: #ffffff;
        background: #202628;
        border-left: 4px solid #f0a500;
        border-radius: 5px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 18%);
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition: opacity 140ms ease, transform 140ms ease;
      }

      .toast.visible {
        opacity: 1;
        transform: translateY(0);
      }

      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      @media (max-width: 720px) {
        .topbar-inner,
        .toolbar-inner,
        main {
          width: min(100% - 28px, 1120px);
        }

        .topbar-inner {
          align-items: flex-start;
          flex-direction: column;
        }

        .toolbar-inner {
          grid-template-columns: 1fr;
          align-items: stretch;
          gap: 14px;
        }

        .icon-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .toast {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div>
          <h1>TemplateIcons</h1>
          <p class="subtitle">template_icons.otf · OpenType 图标字体</p>
        </div>
        <div class="summary" aria-label="字体摘要">
          <div class="summary-item">
            <span class="summary-value" id="total-count">0</span>
            <span class="summary-label">有效图标</span>
          </div>
          <div class="summary-item">
            <span class="summary-value">E000</span>
            <span class="summary-label">起始编码</span>
          </div>
        </div>
      </div>
    </header>

    <section class="toolbar" aria-label="预览控制">
      <div class="toolbar-inner">
        <div class="control">
          <label class="control-label" for="icon-search">搜索</label>
          <div class="search-wrap">
            <input
              id="icon-search"
              type="search"
              placeholder="名称、描述或编码"
              autocomplete="off"
              spellcheck="false"
            />
            <button
              class="clear-search"
              id="clear-search"
              type="button"
              title="清空搜索"
              aria-label="清空搜索"
            >
              ×
            </button>
          </div>
        </div>

        <div class="control">
          <label class="control-label" for="icon-size">
            <span>图标尺寸</span>
            <output class="size-value" id="size-value" for="icon-size">56 px</output>
          </label>
          <div class="size-row">
            <input id="icon-size" type="range" min="24" max="96" value="56" />
          </div>
        </div>

        <div class="control">
          <span class="control-label">预览背景</span>
          <div class="segmented" role="group" aria-label="预览背景">
            <button type="button" data-preview="light" aria-pressed="true">浅色</button>
            <button type="button" data-preview="dark" aria-pressed="false">深色</button>
          </div>
        </div>
      </div>
    </section>

    <main>
      <div class="results-bar">
        <p class="results-count" id="results-count" aria-live="polite"></p>
        <p class="font-state" id="font-state">字体加载中</p>
      </div>
      <section class="icon-grid" id="icon-grid" aria-label="字体图标列表"></section>
      <div class="empty-state" id="empty-state">没有匹配的图标</div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const icons = Object.freeze([
        Object.freeze({
          name: "language",
          codepoint: 0xe000,
          description: "表示语言选择或本地化设置的图标。",
        }),
        Object.freeze({
          name: "check",
          codepoint: 0xe001,
          description: "表示操作成功或选项已确认的图标。",
        }),
      ]);

      const grid = document.querySelector("#icon-grid");
      const searchInput = document.querySelector("#icon-search");
      const clearSearchButton = document.querySelector("#clear-search");
      const sizeInput = document.querySelector("#icon-size");
      const sizeValue = document.querySelector("#size-value");
      const resultsCount = document.querySelector("#results-count");
      const totalCount = document.querySelector("#total-count");
      const emptyState = document.querySelector("#empty-state");
      const fontState = document.querySelector("#font-state");
      const toast = document.querySelector("#toast");
      let toastTimer;

      function hexadecimal(codepoint) {
        return `0x${codepoint.toString(16).toUpperCase().padStart(4, "0")}`;
      }

      function dartReference(name) {
        const parts = name.split("_");
        const identifier = parts
          .map((part, index) =>
            index === 0 ? part : `${part[0].toUpperCase()}${part.slice(1)}`,
          )
          .join("");
        return `TemplateIcons.${identifier}`;
      }

      function iconCard(icon) {
        const article = document.createElement("article");
        article.className = "icon-card";

        const stage = document.createElement("div");
        stage.className = "glyph-stage";

        const glyph = document.createElement("span");
        glyph.className = "glyph";
        glyph.setAttribute("aria-hidden", "true");
        glyph.textContent = String.fromCodePoint(icon.codepoint);
        stage.append(glyph);

        const meta = document.createElement("div");
        meta.className = "icon-meta";

        const titleRow = document.createElement("div");
        titleRow.className = "icon-title-row";

        const name = document.createElement("span");
        name.className = "icon-name";
        name.textContent = icon.name;

        const copyButton = document.createElement("button");
        copyButton.className = "copy-button";
        copyButton.type = "button";
        copyButton.textContent = "复制引用";
        copyButton.setAttribute("aria-label", `复制 ${icon.name} 的 Dart 引用`);
        copyButton.addEventListener("click", () => copyReference(icon));

        const codepoint = document.createElement("code");
        codepoint.className = "codepoint";
        codepoint.textContent = `${hexadecimal(icon.codepoint)} · U+${icon.codepoint
          .toString(16)
          .toUpperCase()
          .padStart(4, "0")}`;

        const description = document.createElement("p");
        description.className = "description";
        description.textContent = icon.description;

        titleRow.append(name, copyButton);
        meta.append(titleRow, codepoint, description);
        article.append(stage, meta);
        return article;
      }

      function render() {
        const query = searchInput.value.trim().toLocaleLowerCase("zh-CN");
        const filtered = icons.filter((icon) => {
          const searchable = `${icon.name} ${icon.description} ${hexadecimal(
            icon.codepoint,
          )} u+${icon.codepoint.toString(16)}`.toLocaleLowerCase("zh-CN");
          return searchable.includes(query);
        });

        grid.replaceChildren(...filtered.map(iconCard));
        resultsCount.textContent = `显示 ${filtered.length} / ${icons.length}`;
        emptyState.classList.toggle("visible", filtered.length === 0);
      }

      async function copyReference(icon) {
        const value = dartReference(icon.name);
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(value);
          } else {
            const temporary = document.createElement("textarea");
            temporary.value = value;
            temporary.style.position = "fixed";
            temporary.style.opacity = "0";
            document.body.append(temporary);
            temporary.select();
            const copied = document.execCommand("copy");
            temporary.remove();
            if (!copied) {
              throw new Error("copy failed");
            }
          }
          showToast(`已复制 ${value}`);
        } catch {
          showToast(`复制失败：${value}`);
        }
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add("visible");
        toastTimer = window.setTimeout(() => toast.classList.remove("visible"), 1800);
      }

      searchInput.addEventListener("input", render);
      clearSearchButton.addEventListener("click", () => {
        searchInput.value = "";
        searchInput.focus();
        render();
      });

      sizeInput.addEventListener("input", () => {
        const value = `${sizeInput.value}px`;
        document.documentElement.style.setProperty("--icon-size", value);
        sizeValue.value = `${sizeInput.value} px`;
        sizeValue.textContent = `${sizeInput.value} px`;
      });

      document.querySelectorAll("[data-preview]").forEach((button) => {
        button.addEventListener("click", () => {
          const isDark = button.dataset.preview === "dark";
          grid.classList.toggle("dark-preview", isDark);
          document.querySelectorAll("[data-preview]").forEach((candidate) => {
            candidate.setAttribute(
              "aria-pressed",
              String(candidate === button),
            );
          });
        });
      });

      totalCount.textContent = String(icons.length);
      render();

      document.fonts
        .load('56px "TemplateIcons"', String.fromCodePoint(icons[0].codepoint))
        .then((loadedFonts) => {
          if (loadedFonts.length === 0) {
            throw new Error("font unavailable");
          }
          fontState.textContent = "字体已加载";
        })
        .catch(() => {
          fontState.textContent = "字体加载失败";
          fontState.classList.add("error");
        });
    </script>
  </body>
</html>
