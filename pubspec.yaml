name: flutter_template
description: "A reusable, testable Flutter application scaffold."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.7.0 <3.8.0"
  flutter: ">=3.29.0 <3.30.0"

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.2.2
  go_router: ^17.0.0
  logging: ^1.3.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/svg/template_layers.svg
  uses-material-design: true
