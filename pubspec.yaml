name: flutter_template
description: "A reusable, testable Flutter application scaffold."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.7.0 <3.8.0"
  flutter: ">=3.29.0 <3.30.0"

dependencies:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.2.2
  go_router: ^17.0.0
  intl: 0.19.0
  logging: ^1.3.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_launcher_icons: 0.14.4
  flutter_lints: ^5.0.0
  flutter_native_splash: 2.4.6
  flutter_test:
    sdk: flutter
  icon_font_generator: 4.0.0
  image: 4.8.0
  xml: 6.5.0
  yaml: 3.1.3

flutter:
  assets:
    - assets/svg/template_layers.svg
  fonts:
    - family: TemplateIcons
      fonts:
        - asset: assets/fonts/template_icons.otf
  uses-material-design: true
