name: Quality

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FLUTTER_VERSION: "3.29.0"
      FLUTTER_REVISION: "35c388afb57ef061d06a39b537336c87e0e3d1b1"
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: "5"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure tool paths
        shell: bash
        run: |
          echo "FLUTTER_ROOT=$RUNNER_TOOL_CACHE/flutter/$FLUTTER_VERSION" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$RUNNER_TOOL_CACHE/pub-cache" >> "$GITHUB_ENV"

      - name: Restore pinned Flutter SDK
        id: flutter-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.FLUTTER_ROOT }}
          key: ${{ runner.os }}-flutter-${{ env.FLUTTER_REVISION }}

      - name: Install pinned Flutter SDK
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git init "$FLUTTER_ROOT"
          git -C "$FLUTTER_ROOT" remote add origin https://github.com/flutter/flutter.git
          git -C "$FLUTTER_ROOT" fetch --depth=1 origin "$FLUTTER_REVISION"
          git -C "$FLUTTER_ROOT" checkout --detach FETCH_HEAD

      - name: Verify Flutter SDK and configure PATH
        shell: bash
        run: |
          actual_revision="$(git -C "$FLUTTER_ROOT" rev-parse HEAD)"
          test "$actual_revision" = "$FLUTTER_REVISION"
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"

      - name: Restore pub cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Configure Flutter
        run: flutter config --no-analytics

      - name: Check committed generated files
        run: dart tool/ci/check_generated_files.dart

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check architecture boundaries
        run: dart tool/ci/check_architecture.dart

      - name: Check platform environment alignment
        run: dart tool/ci/check_platform_environments.dart

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --test-randomize-ordering-seed=20260809

  android:
    name: Build Android environments
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLUTTER_VERSION: "3.29.0"
      FLUTTER_REVISION: "35c388afb57ef061d06a39b537336c87e0e3d1b1"
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: "5"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure tool paths
        shell: bash
        run: |
          echo "FLUTTER_ROOT=$RUNNER_TOOL_CACHE/flutter/$FLUTTER_VERSION" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$RUNNER_TOOL_CACHE/pub-cache" >> "$GITHUB_ENV"

      - name: Restore pinned Flutter SDK
        id: flutter-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.FLUTTER_ROOT }}
          key: ${{ runner.os }}-flutter-${{ env.FLUTTER_REVISION }}

      - name: Install pinned Flutter SDK
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git init "$FLUTTER_ROOT"
          git -C "$FLUTTER_ROOT" remote add origin https://github.com/flutter/flutter.git
          git -C "$FLUTTER_ROOT" fetch --depth=1 origin "$FLUTTER_REVISION"
          git -C "$FLUTTER_ROOT" checkout --detach FETCH_HEAD

      - name: Verify Flutter SDK and configure PATH
        shell: bash
        run: |
          actual_revision="$(git -C "$FLUTTER_ROOT" rev-parse HEAD)"
          test "$actual_revision" = "$FLUTTER_REVISION"
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"

      - name: Restore pub cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Configure Flutter
        run: flutter config --no-analytics

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build all Android environments
        shell: bash
        run: |
          for environment in dev staging prod; do
            flutter build apk \
              --debug \
              --flavor "$environment" \
              --dart-define-from-file="config/$environment.example.json"
          done

  ios:
    name: Build iOS environments without signing
    needs: quality
    runs-on: macos-15
    timeout-minutes: 60
    env:
      COCOAPODS_VERSION: "1.16.2"
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      FLUTTER_VERSION: "3.29.0"
      FLUTTER_REVISION: "35c388afb57ef061d06a39b537336c87e0e3d1b1"
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: "5"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure tool paths
        shell: bash
        run: |
          echo "FLUTTER_ROOT=$RUNNER_TOOL_CACHE/flutter/$FLUTTER_VERSION" >> "$GITHUB_ENV"
          echo "PUB_CACHE=$RUNNER_TOOL_CACHE/pub-cache" >> "$GITHUB_ENV"

      - name: Restore pinned Flutter SDK
        id: flutter-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.FLUTTER_ROOT }}
          key: ${{ runner.os }}-flutter-${{ env.FLUTTER_REVISION }}

      - name: Install pinned Flutter SDK
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git init "$FLUTTER_ROOT"
          git -C "$FLUTTER_ROOT" remote add origin https://github.com/flutter/flutter.git
          git -C "$FLUTTER_ROOT" fetch --depth=1 origin "$FLUTTER_REVISION"
          git -C "$FLUTTER_ROOT" checkout --detach FETCH_HEAD

      - name: Verify Flutter SDK and configure PATH
        shell: bash
        run: |
          actual_revision="$(git -C "$FLUTTER_ROOT" rev-parse HEAD)"
          test "$actual_revision" = "$FLUTTER_REVISION"
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"

      - name: Restore pub cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Configure Flutter
        run: flutter config --no-analytics

      - name: Verify pinned Xcode and CocoaPods
        shell: bash
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          test "$(pod --version)" = "$COCOAPODS_VERSION"

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build all iOS environments without signing
        shell: bash
        run: |
          for environment in dev staging prod; do
            flutter build ios \
              --debug \
              --no-codesign \
              --flavor "$environment" \
              --dart-define-from-file="config/$environment.example.json"
          done
